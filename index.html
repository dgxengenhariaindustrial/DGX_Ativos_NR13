<script>
const csvURL =
  "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ3cZQotIF9E8GIug0GzH75RM5WGeS1Ah3l-d56FaDpq1ZV4To3SxDRwOaBQZTRSDLK6WAgjRdrueh4/pub?gid=0&single=true&output=csv";

const parametros = new URLSearchParams(window.location.search);
const tagPesquisada = (parametros.get("tag") || "").trim().toUpperCase();

/* Leitura correta do CSV, inclusive campos entre aspas */
function parseCSV(texto) {
  const linhas = [];
  let linha = [];
  let campo = "";
  let dentroDeAspas = false;

  for (let i = 0; i < texto.length; i++) {
    const caractere = texto[i];
    const proximo = texto[i + 1];

    if (caractere === '"' && dentroDeAspas && proximo === '"') {
      campo += '"';
      i++;
    } else if (caractere === '"') {
      dentroDeAspas = !dentroDeAspas;
    } else if (caractere === "," && !dentroDeAspas) {
      linha.push(campo.trim());
      campo = "";
    } else if (
      (caractere === "\n" || caractere === "\r") &&
      !dentroDeAspas
    ) {
      if (caractere === "\r" && proximo === "\n") {
        i++;
      }

      linha.push(campo.trim());

      if (linha.some(valor => valor !== "")) {
        linhas.push(linha);
      }

      linha = [];
      campo = "";
    } else {
      campo += caractere;
    }
  }

  if (campo !== "" || linha.length > 0) {
    linha.push(campo.trim());
    linhas.push(linha);
  }

  return linhas;
}

function parseDate(valor) {
  if (!valor) return null;

  const partes = valor.trim().split("/");

  if (partes.length !== 3) return null;

  const dia = Number(partes[0]);
  const mes = Number(partes[1]) - 1;
  const ano = Number(partes[2]);

  const data = new Date(ano, mes, dia);

  return Number.isNaN(data.getTime()) ? null : data;
}

function addMonths(data, meses) {
  const novaData = new Date(data);
  novaData.setMonth(novaData.getMonth() + meses);
  return novaData;
}

function prazoNR13(categoria) {
  const tabela = {
    I: { ext: 12, int: 36 },
    II: { ext: 24, int: 48 },
    III: { ext: 36, int: 72 },
    IV: { ext: 48, int: 96 },
    V: { ext: 60, int: 120 }
  };

  return tabela[(categoria || "").trim().toUpperCase()];
}

function valor(objeto, coluna) {
  return (objeto[coluna] || "").trim();
}

function mostrarErro(mensagem) {
  const elementoEquipamento = document.getElementById("equipamento");

  if (elementoEquipamento) {
    elementoEquipamento.innerText = mensagem;
  }

  console.error(mensagem);
}

async function carregarEquipamento() {
  try {
    if (!tagPesquisada) {
      mostrarErro("TAG não informada no endereço.");
      return;
    }

    const resposta = await fetch(csvURL, {
      cache: "no-store"
    });

    if (!resposta.ok) {
      throw new Error(
        `Não foi possível acessar a planilha. Código: ${resposta.status}`
      );
    }

    const texto = await resposta.text();
    const linhas = parseCSV(texto);

    if (linhas.length < 2) {
      throw new Error("A planilha não possui dados disponíveis.");
    }

    const cabecalho = linhas[0].map(coluna =>
      coluna.replace(/^\uFEFF/, "").trim()
    );

    const equipamentos = linhas.slice(1).map(linha => {
      const objeto = {};

      cabecalho.forEach((coluna, indice) => {
        objeto[coluna] = linha[indice] || "";
      });

      return objeto;
    });

    const equipamento = equipamentos.find(item => {
      const tagPlanilha = valor(item, "TAG EQUIPAMENTO").toUpperCase();
      return tagPlanilha === tagPesquisada;
    });

    if (!equipamento) {
      mostrarErro(`Equipamento não encontrado: ${tagPesquisada}`);
      return;
    }

    /* DADOS DO EQUIPAMENTO */

    document.getElementById("equipamento").innerText =
      "Equipamento: " + valor(equipamento, "TAG EQUIPAMENTO");

    document.getElementById("categoria").innerText =
      valor(equipamento, "CATEGORIA NR-13") || "-";

    document.getElementById("pmta").innerText =
      valor(equipamento, "PMTA (bar)")
        ? valor(equipamento, "PMTA (bar)") + " bar"
        : "-";

    document.getElementById("fluido").innerText =
      valor(equipamento, "FLUIDO") || "-";

    /* CÁLCULO DA PRÓXIMA INSPEÇÃO */

    const categoria = valor(equipamento, "CATEGORIA NR-13");
    const prazo = prazoNR13(categoria);

    const dataExterna = parseDate(
      valor(equipamento, "DATA - VISUAL EXTERNA")
    );

    const dataInterna = parseDate(
      valor(equipamento, "DATA - VISUAL INTERNA")
    );

    const proximasInspecoes = [];

    if (dataExterna && prazo?.ext) {
      proximasInspecoes.push(addMonths(dataExterna, prazo.ext));
    }

    if (dataInterna && prazo?.int) {
      proximasInspecoes.push(addMonths(dataInterna, prazo.int));
    }

    proximasInspecoes.sort((a, b) => a - b);

    const proximaInspecao =
      proximasInspecoes.length > 0 ? proximasInspecoes[0] : null;

    document.getElementById("proxima").innerText = proximaInspecao
      ? proximaInspecao.toLocaleDateString("pt-BR")
      : "-";

    /* STATUS */

    const hoje = new Date();
    hoje.setHours(0, 0, 0, 0);

    if (!proximaInspecao) {
      document.getElementById("status").innerHTML =
        '<span class="status bad">SEM DATA</span>';
    } else if (proximaInspecao < hoje) {
      document.getElementById("status").innerHTML =
        '<span class="status bad">VENCIDA</span>';
    } else {
      document.getElementById("status").innerHTML =
        '<span class="status ok">DENTRO DO PRAZO</span>';
    }

    /* RELATÓRIOS */

    const relatorios = [
      {
        nome: "Inspeção Visual Externa",
        data: valor(equipamento, "DATA - VISUAL EXTERNA"),
        link: valor(equipamento, "LINK - VISUAL EXTERNA")
      },
      {
        nome: "Inspeção Visual Interna",
        data: valor(equipamento, "DATA - VISUAL INTERNA"),
        link: valor(equipamento, "LINK - VISUAL INTERNA")
      },
      {
        nome: "Medição de Espessura",
        data: valor(equipamento, "DATA - MEDIÇÃO DE ESPESSURA"),
        link: valor(equipamento, "LINK - MEDIÇÃO DE ESPESSURA")
      },
      {
        nome: "Teste Hidrostático",
        data: valor(equipamento, "DATA - TESTE HIDROSTÁTICO"),
        link: valor(equipamento, "LINK - TESTE HIDROSTÁTICO")
      }
    ];

    let htmlRelatorios = "";

    relatorios.forEach(relatorio => {
      if (relatorio.link) {
        htmlRelatorios += `
          <tr>
            <td>${relatorio.nome}</td>
            <td>${relatorio.data || "-"}</td>
            <td>
              <a
                class="button"
                href="${relatorio.link}"
                target="_blank"
                rel="noopener noreferrer"
              >
                Visualizar
              </a>
            </td>
          </tr>
        `;
      }
    });

    document.getElementById("relatorios").innerHTML =
      htmlRelatorios ||
      '<tr><td colspan="3">Nenhum relatório disponível.</td></tr>';

    /* ART */

    const linkART = valor(equipamento, "LINK - ART");

    document.getElementById("art").innerHTML = linkART
      ? `
        <a
          class="button"
          href="${linkART}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Visualizar ART
        </a>
      `
      : "Não disponível";

    /* PRONTUÁRIO */

    const linkProntuario = valor(equipamento, "LINK - PRONTUÁRIO");

    document.getElementById("prontuario").innerHTML = linkProntuario
      ? `
        <a
          class="button"
          href="${linkProntuario}"
          target="_blank"
          rel="noopener noreferrer"
        >
          Visualizar Prontuário
        </a>
      `
      : "Não disponível";

  } catch (erro) {
    mostrarErro("Erro ao carregar os dados do equipamento.");
    console.error(erro);
  }
}

carregarEquipamento();
</script>
