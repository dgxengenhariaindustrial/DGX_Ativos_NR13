<script>

const csvURL="https://docs.google.com/spreadsheets/d/e/2PACX-1vQ3cZQotIF9E8GIug0GzH75RM5WGeS1Ah3l-d56FaDpq1ZV4To3SxDRwOaBQZTRSDLK6WAgjRdrueh4/pub?gid=0&single=true&output=csv";

const tag = new URLSearchParams(window.location.search).get("tag");

function parseDate(d){
if(!d) return null
const p = d.split("/")
return new Date(p[2],p[1]-1,p[0])
}

function addMonths(date,months){
const d = new Date(date)
d.setMonth(d.getMonth()+months)
return d
}

function prazoNR13(cat){

const tabela={
"I":{ext:12,int:36},
"II":{ext:24,int:48},
"III":{ext:36,int:72},
"IV":{ext:48,int:96},
"V":{ext:60,int:120}
}

return tabela[cat]

}

fetch(csvURL)

.then(r=>r.text())

.then(text=>{

const linhas = text.split("\n").map(l=>l.split(","))

const header = linhas[0].map(h=>h.trim())

const dados = linhas.slice(1)

let equipamento = null

dados.forEach(linha=>{

let obj={}

header.forEach((h,i)=>{

obj[h]=linha[i]

})

if(obj["TAG EQUIPAMENTO"]===tag){

equipamento=obj

}

})

if(!equipamento) return

/* DADOS */

document.getElementById("equipamento").innerText="Equipamento: "+equipamento["TAG EQUIPAMENTO"]

document.getElementById("categoria").innerText=equipamento["CATEGORIA NR-13"]

document.getElementById("pmta").innerText=equipamento["PMTA (bar)"]+" bar"

document.getElementById("fluido").innerText=equipamento["FLUIDO"]

/* PRAZOS */

const prazo = prazoNR13(equipamento["CATEGORIA NR-13"])

const dataExt = parseDate(equipamento["DATA - VISUAL EXTERNA"])

const dataInt = parseDate(equipamento["DATA - VISUAL INTERNA"])

let proximas=[]

if(dataExt && prazo?.ext) proximas.push(addMonths(dataExt,prazo.ext))

if(dataInt && prazo?.int) proximas.push(addMonths(dataInt,prazo.int))

const proxima = proximas.length ? proximas.sort((a,b)=>a-b)[0] : null

document.getElementById("proxima").innerText = proxima ? proxima.toLocaleDateString("pt-BR") : "-"

/* STATUS */

const hoje=new Date()

if(proxima && proxima<hoje){

document.getElementById("status").innerHTML='<span class="status bad">VENCIDA</span>'

}else{

document.getElementById("status").innerHTML='<span class="status ok">DENTRO DO PRAZO</span>'

}

/* RELATÓRIOS */

const relatorios=[

{
nome:"Inspeção Visual Externa",
data:equipamento["DATA - VISUAL EXTERNA"],
link:equipamento["LINK - VISUAL EXTERNA"]
},

{
nome:"Inspeção Visual Interna",
data:equipamento["DATA - VISUAL INTERNA"],
link:equipamento["LINK - VISUAL INTERNA"]
},

{
nome:"Medição de Espessura",
data:equipamento["DATA - MEDIÇÃO DE ESPESSURA"],
link:equipamento["LINK - MEDIÇÃO DE ESPESSURA"]
},

{
nome:"Teste Hidrostático",
data:equipamento["DATA - TESTE HIDROSTÁTICO"],
link:equipamento["LINK - TESTE HIDROSTÁTICO"]
}

]

let html=""

relatorios.forEach(r=>{

if(r.link){

html+=`
<tr>
<td>${r.nome}</td>
<td>${r.data || "-"}</td>
<td><a class="button" href="${r.link}" target="_blank">Visualizar</a></td>
</tr>
`

}

})

document.getElementById("relatorios").innerHTML=html

/* ART */

if(equipamento["LINK - ART"]){

document.getElementById("art").innerHTML=`<a class="button" href="${equipamento["LINK - ART"]}" target="_blank">Visualizar ART</a>`

}else{

document.getElementById("art").innerText="Não disponível"

}

/* PRONTUÁRIO */

if(equipamento["LINK - PRONTUÁRIO"]){

document.getElementById("prontuario").innerHTML=`<a class="button" href="${equipamento["LINK - PRONTUÁRIO"]}" target="_blank">Visualizar Prontuário</a>`

}else{

document.getElementById("prontuario").innerText="Não disponível"

}

})

</script>
